<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
html { font-size: calc(100vw / 18.75); } /* everything below is in rem, so the widget scales with its size */
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #fff; user-select: none; font-family: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
.w { position: fixed; inset: 0; border-radius: 1.9rem; overflow: hidden; background: linear-gradient(135deg, #3d4452, #1d212b); box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 4rem; opacity: .75; pointer-events: none; }
.w:has(#c:not([hidden])) .empty { display: none; }
.ui { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .25s ease; background: linear-gradient(180deg, rgba(0,0,0,.28), transparent 35%, transparent 55%, rgba(0,0,0,.4)); }
.w:hover .ui { opacity: 1; pointer-events: auto; }
.panel { position: absolute; left: .7rem; right: .7rem; bottom: 1.5rem; padding: .75rem .8rem .85rem 1rem; border-radius: 1.4rem;
  background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.06)), rgba(16,14,26,.28);
  backdrop-filter: blur(26px) saturate(190%); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 .6rem 1.9rem rgba(0,0,0,.35); }
b, small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
b { font-size: 1rem; letter-spacing: -.01em; } small { font-size: .75rem; opacity: .75; margin-top: .06rem; }
.ctl { display: flex; justify-content: space-between; align-items: center; margin-top: .45rem; }
button { background: none; border: 0; color: inherit; width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; }
button:hover { background: rgba(255,255,255,.2); }
svg { width: 1.35rem; height: 1.35rem; fill: currentColor; }
#play { background: rgba(255,255,255,.95); color: #15131f; width: 2.7rem; height: 2.7rem; }
.prog { height: .2rem; border-radius: .2rem; background: rgba(255,255,255,.25); margin-top: .5rem; overflow: hidden; }
#bar { height: 100%; width: 0; background: #fff; }
.x { position: absolute; top: .7rem; right: .7rem; width: 1.8rem; height: 1.8rem; background: rgba(0,0,0,.35); }
.x svg { width: .85rem; height: .85rem; }
.grip { position: absolute; right: .15rem; bottom: .15rem; width: 1.3rem; height: 1.3rem; cursor: nwse-resize; border-radius: 0; background: none; }
.grip svg { width: .9rem; height: .9rem; fill: none; stroke: rgba(255,255,255,.85); stroke-width: 2; stroke-linecap: round; }
body:not(.playing) .i-pause, body.playing .i-play { display: none; }
.heart path { fill: none; stroke: currentColor; stroke-width: 2; }
body.liked .heart path { fill: #ff5d8f; stroke: #ff5d8f; }
</style>
</head>
<body>
<div class="w">
  <img id="c" alt="" hidden>
  <div class="empty">&#9835;</div>
  <div class="ui">
    <button class="x" id="close" aria-label="Close widget"><svg viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    <div class="panel">
      <b id="t">Nothing playing</b><small id="a">OpenPlayer</small>
      <div class="ctl">
        <button id="like" class="heart" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21l-1.4-1.3C5.4 15 2 12 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.5-3.4 6.5-8.6 11.2L12 21z"/></svg></button>
        <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
        <button id="play" aria-label="Play or pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
        <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM14.5 12 6 18V6z"/></svg></button>
        <span style="width:2.3rem"></span>
      </div>
      <div class="prog"><div id="bar"></div></div>
    </div>
    <div class="grip" id="grip" title="Resize"><svg viewBox="0 0 24 24"><path d="M20 10 10 20M20 16l-4 4"/></svg></div>
  </div>
</div>
<script src="widget.js"></script>
</body>
</html>
