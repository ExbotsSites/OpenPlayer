<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src file: http://127.0.0.1:*; style-src 'self'; script-src 'self'">
<title>OpenPlayer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg"></div>

<header>
  <div class="hl"><button class="tg" id="navbtn" aria-label="Show or hide the sidebar"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="brand">OpenPlayer</span></div>
  <div class="tools">
    <button class="pfp" id="pfp" aria-label="Account"><span id="pfpl"></span><img id="pfpimg" alt="" hidden></button>
  </div>
</header>

<main>
  <nav class="glass" id="nav" aria-label="Library">
    <button data-v="home">Home</button>
    <button data-v="lyrics">Now playing</button>
    <button data-v="search">Search</button>
    <button data-v="liked">Liked songs</button>
    <button data-v="queue">Queue</button>
    <button data-v="settings">Settings</button>
    <div class="sec"><span>Playlists</span><button id="newpl" aria-label="New playlist">+</button></div>
    <input id="plin" placeholder="Playlist name" hidden>
    <div id="pls"></div>
  </nav>

  <section class="card glass">
    <div class="art">
      <img id="cover" alt="" hidden>
      <div class="art-empty">Search or drop songs</div>
    </div>
    <div class="meta">
      <div class="mt"><h1 id="title">Nothing playing</h1><p id="artist">Pick a song to start</p></div>
      <button class="hb" id="heart" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21l-1.4-1.3C5.4 15 2 12 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.5-3.4 6.5-8.6 11.2L12 21z"/></svg></button>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="ctrl">
      <button class="ic" id="shuffle" aria-label="Shuffle"><svg class="st" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="ic" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button class="ic big" id="play" aria-label="Play or pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="ic" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM14.5 12 6 18V6z"/></svg></button>
      <button class="ic" id="repeat" aria-label="Repeat"><svg class="st" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
    </div>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </section>

  <section id="stage">
    <div id="home"></div>
    <div id="lyrics" hidden><div id="lines"><p class="note">Lyrics appear here</p></div></div>
    <div id="settings" hidden></div>
    <div id="panel" hidden>
      <div class="phead">
        <h2 id="ptitle"></h2>
        <input id="q" placeholder="Search YouTube Music" hidden>
        <button class="pill glass" id="delpl" hidden>Delete playlist</button>
      </div>
      <div id="rows"></div>
    </div>
  </section>
</main>

<div id="menu" class="glass" hidden></div>
<div id="acct" class="glass" hidden></div>
<div id="login" hidden>
  <div class="lcard glass">
    <h1 class="lbrand">OpenPlayer</h1>
    <p>Sign in to keep your liked songs, playlists and settings on your own profile.</p>
    <button class="lbtn" id="lgd">Continue with Discord</button>
    <button class="llink" id="lgg">Use without an account</button>
    <p id="lgerr"></p>
  </div>
</div>
<div id="toast" class="glass" hidden></div>
<audio id="audio"></audio>
<script src="renderer.js"></script>
</body>
</html>
